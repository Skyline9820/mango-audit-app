name: Deploy

# Se dispara SOLO cuando hay un push directo o un merge (de un PR) hacia
# las ramas develop o main. Cada rama va a un ambiente distinto.
#
# NOTA: este workflow está adaptado a hosting SOLO CON FTP (ej. Neubox,
# plan "Push It"), donde NO hay acceso SSH ni terminal remota. Por eso
# el mecanismo de rollback es distinto al de un servidor con SSH: en
# vez de mover un symlink en el servidor, si el health check falla,
# se vuelve a subir por FTP la última versión que sí funcionó.
on:
  push:
    branches:
      - develop   # -> ambiente de staging/pruebas
      - main      # -> ambiente de producción

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Necesario para poder crear/mover el tag "*-stable" (git push) desde
    # el propio workflow.
    permissions:
      contents: write

    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    # Evita que dos despliegues a la misma rama corran al mismo tiempo
    # y se pisen subiendo archivos por FTP en paralelo.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    env:
      # Carpeta remota dentro del hosting de Neubox para cada ambiente
      # (ajusta estas rutas a como esté organizado el FTP real).
      FTP_TARGET_DIR: '/'
      HEALTHCHECK_URL: ${{ github.ref_name == 'main' && secrets.HEALTHCHECK_URL_PROD || secrets.HEALTHCHECK_URL_STAGING }}
      # Un tag de Git que siempre apunta al último commit que SÍ pasó
      # el health check. Sirve como "la última versión buena conocida"
      # para poder volver a subirla si el nuevo despliegue falla.
      STABLE_TAG: ${{ github.ref_name == 'main' && 'production-stable' || 'staging-stable' }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # trae todo el historial, se necesita para poder saltar a STABLE_TAG si hace falta

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Instalar dependencias (solo producción)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      # Sube el código actual por FTP a la carpeta del ambiente
      # correspondiente. No hay "carpeta de release" separada porque
      # el hosting de solo-FTP no permite manejarlo con symlinks.
      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ env.FTP_TARGET_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/tests/**
            **/.env.example

      - name: Esperar a que el hosting recargue los archivos
        run: sleep 5

      # Verifica que la app responda bien tras el despliegue. Si no,
      # el paso siguiente hace el rollback.
      - name: Verificar salud de la app
        id: healthcheck
        run: |
          if curl -fsS --max-time 10 "${{ env.HEALTHCHECK_URL }}" > /dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # Si el health check pasó, este commit se vuelve la nueva
      # "versión estable" a la que regresar en el futuro si algo falla.
      - name: Marcar este commit como la versión estable
        if: steps.healthcheck.outputs.ok == 'true'
        run: |
          git tag -f ${{ env.STABLE_TAG }}
          git push origin ${{ env.STABLE_TAG }} --force

      # Si el health check falló: regresa el código al último commit
      # estable conocido y lo vuelve a subir por FTP (rollback manual
      # vía re-despliegue, que es lo único posible sin acceso SSH).
      - name: Rollback — volver a subir la última versión estable
        if: steps.healthcheck.outputs.ok == 'false'
        run: |
          echo "::error::Health check falló para ${{ github.sha }}. Revirtiendo a ${{ env.STABLE_TAG }}."
          git fetch origin tag ${{ env.STABLE_TAG }} || echo "No existe una versión estable previa registrada aún."
          if git rev-parse "${{ env.STABLE_TAG }}" >/dev/null 2>&1; then
            git checkout "${{ env.STABLE_TAG }}"
            composer install --no-dev --optimize-autoloader --prefer-dist --no-progress
          else
            echo "No hay versión estable anterior a la cual volver — se deja el despliegue fallido para revisión manual."
          fi

      - name: Volver a subir la versión estable por FTP (si hubo rollback)
        if: steps.healthcheck.outputs.ok == 'false'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ env.FTP_TARGET_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/tests/**
            **/.env.example

      - name: Marcar el workflow como fallido (para que se note en GitHub)
        if: steps.healthcheck.outputs.ok == 'false'
        run: exit 1

      # Aquí se conecta la notificación real: Slack, correo, Teams, etc.
      - name: Notificar despliegue fallido (y revertido)
        if: failure()
        run: |
          echo "::error::El despliegue a ${{ github.ref_name }} falló y se revirtió a la última versión estable."
          # Ejemplo con un webhook de Slack (requiere el secreto SLACK_WEBHOOK_URL):
          # curl -X POST -H 'Content-type: application/json' \
          #   --data "{\"text\":\"Deploy a ${{ github.ref_name }} FALLÓ y se revirtió. Commit: ${{ github.sha }}\"}" \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
